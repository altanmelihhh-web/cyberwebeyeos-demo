# CyberWebEyeOS synthetic demo configuration — contains no secrets
config system global
    set hostname "edge-fw-01"
end
config system interface
    edit "port1"
        set alias "WAN"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
    next
    edit "port2"
        set alias "MGMT"
